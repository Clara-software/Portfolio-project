<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 

  <!-- name -->
  <title>Contact Me</title>

  <!-- Link with CSS  -->
  <link rel ="stylesheet" href = "./css/main.css">
  <link rel="stylesheet" href="./css/contact.css">
</head>
<body>
  <main class="contact-page" >
    <section class="contact">
      <h1>Contact form</h1>

      <!-- Created a bone for contact form -->

      <form id="contact-form" class="contact-form" novalidate>

  
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstname" placeholder="First Name"  required>

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" placeholder="Last Name:"  required>

        <label for="date">Date:</label>
        <input type="date" id="date" placeholder="Date" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder=" Email address:"  required>
        <input type="email" id ="confirm-email" name="confirmemail" placeholder="Confirm Email address:"  required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id ="phone" name="phone" placeholder="Phone Number:" required>

        <label for="description"> Description:</label>
        <textarea name="description" id ="description"rows="5" cols="60" placeholder="Enter your description here:"  required></textarea>

        <!-- Chose contact-method -->

        <div class="contact-methods">
          <h2> Contact Me By:</h2>
          <label>
          <input type="radio" name="contactby" value="email" checked> Email
          </label><br>

          <label>
          <input type="radio" name="contactby" value="phone"> Phone
          </label><br>
        </div>

        <!-- submit button -->
        <button type="submit" id="submit">Submit</button>


      </form>
    </section>
  </main>

  <!-- the popup at the end = show off all the information -->
  <div id="simple-popup"></div>


  <script src="./js/main.js"></script>
</body>
</html>
